name: Backfill Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Monero version (e.g., 0.18.5.1)'
        required: true
      keys:
        description: 'Optional fingerprint override (must match docker/keys.asc primary fpr / KEYS pin). Empty = use KEYS file. Fake/mismatched keys fail the job.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enforce fingerprint policy (no fake-keys free publish)
        id: keys
        run: |
          set -euo pipefail
          PIN=$(grep -oE '[0-9A-Fa-f]{40}' KEYS | head -1 | tr 'a-f' 'A-F')
          FPR=$(gpg --show-keys --with-colons docker/keys.asc 2>/dev/null \
            | awk -F: '/^fpr:/{print $10; exit}')
          FPR=$(echo "$FPR" | tr 'a-f' 'A-F')
          if [ -z "$PIN" ] || [ -z "$FPR" ]; then
            echo "ERROR: could not read KEYS pin or keys.asc fingerprint"; exit 1
          fi
          if [ "$PIN" != "$FPR" ]; then
            echo "ERROR: KEYS pin ($PIN) != keys.asc primary fpr ($FPR)"; exit 1
          fi

          INPUT_RAW="${{ github.event.inputs.keys }}"
          # Strip whitespace; if non-empty, every token must equal the pinned fpr
          if [ -n "$(echo "$INPUT_RAW" | tr -d '[:space:]')" ]; then
            for tok in $INPUT_RAW; do
              TOK=$(echo "$tok" | tr -d '[:space:]' | tr 'a-f' 'A-F')
              [ -z "$TOK" ] && continue
              if [ "$TOK" != "$PIN" ]; then
                echo "ERROR: input key fingerprint $TOK does not match keys.asc / KEYS pin $PIN"
                echo "Image always imports docker/keys.asc; CI keys input cannot swap the trust root."
                exit 1
              fi
            done
            echo "keys input matches pin: $PIN"
          else
            echo "keys input empty — using KEYS pin $PIN (keys.asc is image trust root)"
          fi
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: Validate version input
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] || ! echo "$V" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "ERROR: invalid version input: $V"; exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          # keys.asc sole trust root — no KEYS build-arg (was dead code)
          build-args: |
            VERSION=${{ github.event.inputs.version }}
          tags: ghcr.io/kub0-ai/monero:${{ github.event.inputs.version }}
          cache-from: type=registry,ref=ghcr.io/kub0-ai/monero:buildcache
          cache-to: type=registry,ref=ghcr.io/kub0-ai/monero:buildcache,mode=max

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Monero ${{ github.event.inputs.version }}" || true
          git push origin "v${{ github.event.inputs.version }}" || true
