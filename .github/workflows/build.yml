name: Build and Push

on:
  push:
    branches: [main]
    paths: ['docker/**', 'VERSION', 'KEYS']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read VERSION
        id: version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if [ -z "$V" ]; then
            echo "VERSION file is empty"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Assert KEYS pin matches keys.asc
        run: |
          set -euo pipefail
          PIN=$(grep -oE '[0-9A-Fa-f]{40}' KEYS | head -1 | tr 'a-f' 'A-F')
          FPR=$(gpg --show-keys --with-colons docker/keys.asc 2>/dev/null \
            | awk -F: '/^fpr:/{print $10; exit}')
          FPR=$(echo "$FPR" | tr 'a-f' 'A-F')
          if [ -z "$PIN" ] || [ -z "$FPR" ]; then
            echo "ERROR: could not read KEYS pin or keys.asc fingerprint"; exit 1
          fi
          if [ "$PIN" != "$FPR" ]; then
            echo "ERROR: KEYS pin ($PIN) != keys.asc primary fpr ($FPR)"; exit 1
          fi
          echo "KEYS pin matches keys.asc: $PIN"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          # keys.asc is sole trust root inside the image — no KEYS build-arg
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/kub0-ai/monero:${{ steps.version.outputs.version }}
            ghcr.io/kub0-ai/monero:latest
          cache-from: type=registry,ref=ghcr.io/kub0-ai/monero:buildcache
          cache-to: type=registry,ref=ghcr.io/kub0-ai/monero:buildcache,mode=max

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Monero ${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true
