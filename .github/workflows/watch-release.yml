name: Watch Upstream Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_REPO="monero-project/monero"
          LATEST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=30" \
            | jq -r '
              [.[] | select(.prerelease == false and .draft == false) | .tag_name
               | ltrimstr("v")
               | select(test("^[0-9]+(\\.[0-9]+){1,3}$"))]
              | sort_by(split(".") | map(tonumber))
              | last
            ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not detect upstream version"; exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "tag=v${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream (max semver): v${LATEST}"

      - name: Read current version
        id: current
        run: |
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT"

      - name: Check if update needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already up to date"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXISTING_PR=$(gh pr list --head "release/${VERSION}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${VERSION}"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New version available: ${VERSION}"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR (human gate — no direct main push)
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            echo "$VERSION" > VERSION
            if ! git diff --quiet VERSION; then
              git add VERSION
              git commit -m "release: bump to v${VERSION}"
              git push origin "${BRANCH}"
            fi
          else
            git checkout -b "$BRANCH"
            echo "$VERSION" > VERSION
            git add VERSION
            git commit -m "release: bump to v${VERSION}"
            git push origin "$BRANCH"
          fi

          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --title "Release ${VERSION}" \
              --body "$(cat <<EOF
          ## Monero ${VERSION}

          Upstream release: https://github.com/monero-project/monero/releases/tag/${{ steps.upstream.outputs.tag }}
          Downloads: https://downloads.getmonero.org/cli/

          ### Trust root
          Image builds import \`docker/keys.asc\` only (binaryFate). Repo-root \`KEYS\` is the fingerprint pin for CI policy — not a Docker build-arg.

          ### Action required (human gate — GPG)
          - [ ] Confirm hashes.txt verifies with GOODSIG from binaryFate (\`81AC591FE9C4B65C5806AFC3F0AF4D462A0BDF92\`)
          - [ ] Review upstream release notes for breaking changes
          - [ ] If the release signer changes, update \`docker/keys.asc\` **and** the fingerprint in \`KEYS\` together

          Merging this PR triggers a build of \`ghcr.io/kub0-ai/monero:${VERSION}\`.
          Direct pushes to main for VERSION bumps are intentionally disabled.
          EOF
          )" || true
          fi
